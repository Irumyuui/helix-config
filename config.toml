theme = "catppuccin_frappe_translate"

[editor]
auto-format = false
# auto-reload = true
# auto-info = true
undercurl = true
bufferline = "multiple"
color-modes = true
cursorcolumn = true
cursorline = true
idle-timeout = 40
line-number = "relative"
mouse = true
true-color = true
end-of-line-diagnostics = "hint"
insert-final-newline = true
# rainbow-brackets = true
shell = ["nu", "--stdin", "-c"]
default-line-ending = "native"

# [editor.word-completion]
# enable = true
# trigger-length = 4

# [editor.version-control]
# inline-blame = true

# [editor.inline-blame]
# show = "cursor-line"

[editor.statusline]
left = [
  "mode",
  "spinner",
  "version-control",
  "read-only-indicator",
  "file-name",
  "file-modification-indicator",
]
center = ["diagnostics", "workspace-diagnostics"]
right = [
  "register",
  "position",
  "primary-selection-length",
  "selections",
  "file-encoding",
  "file-indent-style",
  "file-line-ending",
  "position-percentage",
  "file-type",
  "spacer",
]
diagnostics = ["hint", "info", "warning", "error"]
workspace-diagnostics = ["hint", "info", "warning", "error"]
# separator = "│"

[editor.statusline.mode]
insert = "INSERT"
normal = "NORMAL"
select = "SELECT"

# [editor.explorer]
# position = "center"
# column-width = 22

[editor.lsp]
auto-signature-help = true
display-inlay-hints = true
display-messages = true
display-signature-help-docs = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.whitespace]
render = "all"

[editor.whitespace.characters]
nbsp = "␣"
newline = "⏎"
space = "·"
tab = "⇥"
tabpad = "-"  # Tabs will look like "→···" (depending on tab width)

[editor.soft-wrap]
enable = true

[editor.auto-save]
after-delay.enable = true

[editor.indent-guides]
render = true
character = "╎" # Some characters that work well: "▏", "┆", "┊", "⸽"
skip-levels = 1
# rainbow-indent = "dim"

[editor.inline-diagnostics]
cursor-line = "warning" # show warnings and errors on the cursorline inline

[icons.vcs]
enabled = true
icon = "⌬"

[icons.kind]
enabled = true
number = ""
string = ""
function = "󰊕"
color = "󰌁"

[icons.fs]
enabled = true
php = { glyph = "", color = "#1976D2" }
godot = { glyph = "", color = "#2196F3" }
gd = { glyph = "", color = "#2196F3" }
gdshader = { glyph = "󰘷", color = "#9C27B0" }
wgsl = { glyph = "", color = "#E06C75" }
wesl = { glyph = "", color = "#E06C75" }
cj = ""
yml = ""
yaml = ""
conf = ""
kdl = ""
Makefile = ""
ron = "󰔘"
db = ""
sql = "󰆼"
jsonc = ""
json5 = ""
"ignore" = "󰈉"
".ignore" = "󰈉"
"lrc" = "󰨖"
"env" = ""
"hurl" = { glyph = "", color = "#DE3163" }
directory = "🖿"

[icons.ui.statusline]
separator = "⸽"

[icons.diagnostic]
error = '!'
warning = '▲'
info = '●'
hint = '○'

[icons.ui.virtual]
ruler = "|"

[keys.normal]
"A-down" = [
  "extend_line_below",
  "delete_selection",
  "paste_after",
  "collapse_selection",
]
"A-j" = [
  "extend_line_below",
  "delete_selection",
  "paste_after",
  "collapse_selection",
]
"A-k" = [
  "extend_line_below",
  "delete_selection",
  "move_visual_line_up",
  "paste_before",
  "collapse_selection",
]
"A-up" = [
  "extend_line_below",
  "delete_selection",
  "move_visual_line_up",
  "paste_before",
  "collapse_selection",
]

# G = "goto_last_line"
C-s = ":write"

tab = "move_parent_node_end"
S-tab = "move_parent_node_start"

"\\" = ":reflow"        # |
X = "extend_line_above"

# use ctrl+/ to toggle comments
# C-c = "no_op"
# "C-/" = "toggle_comments"

# [keys.normal.z]
# o = [":toggle soft-wrap.wrap-at-text-width"]

[keys.normal.space]
x = ":buffer-close"
n = "signature_help"

[keys.normal.space.w]
r = ":reload"
c = ":config-reload"

[keys.normal.space.i]
c = ":toggle inline-diagnostics.cursor-line hint disable"
e = ":toggle end-of-line-diagnostics warning disable"
o = ":toggle inline-diagnostics.other-lines error disable"

[keys.insert]
S-tab = "move_parent_node_start"

# use ctrl+/ to toggle comments
# C-c = "no_op"
# "C-/" = "toggle_comments"

[keys.select]
tab = "extend_parent_node_end"
S-tab = "extend_parent_node_start"

# use ctrl+/ to toggle comments
# C-c = "no_op"
# "C-/" = "toggle_comments"
